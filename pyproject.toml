[project]
name = "memoria-e030"
version = "0.1.0"
description = "Memoria de cálculo sísmica (E.030) con motor público, datos privados, pruebas y salidas a Excel y PDF"
readme = "README.md"
authors = [
    { name = "eder_3232", email = "eldebar.dk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "formulas>=1.3.4",
    "handcalcs>=1.11.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
memoria = "memoria_e030.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
]
